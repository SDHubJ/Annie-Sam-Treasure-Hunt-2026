<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc9df">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css?v=2">
<title>Checking in…</title>
</head>
<body>
<div class="page">
<svg class="sticker banana" viewBox="0 0 150 108" fill="none" aria-hidden="true" style="right: 16px; bottom: 40px; transform: rotate(-10deg);"><path d="M14 18 C 26 78, 104 96, 136 48 C 128 52, 118 58, 104 60 C 72 64, 40 50, 26 16 Z" fill="#FFD93B" stroke="#22101F" stroke-width="5" stroke-linejoin="round"/><path d="M30 26 C 46 56, 80 66, 116 56" stroke="#D9A91A" stroke-width="4" stroke-linecap="round"/><path d="M14 18 L20 8 L28 14 L26 16" fill="#6B4E12" stroke="#22101F" stroke-width="5" stroke-linejoin="round"/></svg>
<main class="wrap">
  <section class="card" id="card" aria-live="polite">
    <div class="waiting"><span class="spinner"></span><span>Checking your find…</span></div>
  </section>
</main>
</div>

<script src="assets/config.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
<script>
(async function () {
  const code = new URLSearchParams(location.search).get('c') || '';
  const card = document.getElementById('card');
  const el = Hunt.el;

  function fail(text) {
    card.innerHTML = '';
    card.appendChild(el('h2', { text: 'Not quite' }));
    card.appendChild(el('p', { class: 'notice bad', text: text }));
    card.appendChild(el('a', { class: 'btn', href: 'hunt.html', text: 'Back to my clue' }));
  }

  if (!code) return fail('This QR is missing its code. Keep hunting.');

  // No crew on this phone yet: remember the scan, join first, then come back.
  if (!Hunt.getTeam()) {
    Hunt.setPendingCode(code);
    location.replace('index.html');
    return;
  }

  try {
    const s = await Hunt.post('checkin', { team: Hunt.getTeam(), code: code });
    Hunt.setFlash(s.message || 'Checked in.', 'ok');
    location.replace('hunt.html');
  } catch (e) {
    fail(e.message);
  }
})();
</script>
</body>
</html>
