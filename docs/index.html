<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc9df">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css?v=2">
<title>Annie &amp; Sam's Treasure Hunt 2026</title>
</head>
<body>
<div class="page">
<svg class="sticker banana" viewBox="0 0 150 108" fill="none" aria-hidden="true" style="left: 18px; bottom: 26px; transform: rotate(-12deg);"><path d="M14 18 C 26 78, 104 96, 136 48 C 128 52, 118 58, 104 60 C 72 64, 40 50, 26 16 Z" fill="#FFD93B" stroke="#22101F" stroke-width="5" stroke-linejoin="round"/><path d="M30 26 C 46 56, 80 66, 116 56" stroke="#D9A91A" stroke-width="4" stroke-linecap="round"/><path d="M14 18 L20 8 L28 14 L26 16" fill="#6B4E12" stroke="#22101F" stroke-width="5" stroke-linejoin="round"/></svg>
<svg class="sticker croc" viewBox="0 0 190 92" fill="none" aria-hidden="true"><path d="M6 92 L6 58 Q 10 34 40 30 L150 22 Q 184 22 186 44 Q 186 58 170 60 L150 62 L150 92 Z" fill="#1E9E5A" stroke="#22101F" stroke-width="4" stroke-linejoin="round"/><path d="M40 30 Q 44 6 66 8 Q 86 10 84 30" fill="#1E9E5A" stroke="#22101F" stroke-width="4"/><circle cx="64" cy="22" r="9" fill="#FFFFFF" stroke="#22101F" stroke-width="3"/><ellipse cx="66" cy="22" rx="2.5" ry="6" fill="#22101F"/><path d="M60 60 l8 -8 l8 8 l8 -8 l8 8 l8 -8 l8 8 l8 -8 l8 8" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><circle cx="172" cy="34" r="3" fill="#22101F"/></svg>
<main class="wrap">
  <div class="topbar">
    <span class="brand">London Fields · 26.09</span>
    <a class="pill" href="leaderboard.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Leaderboard</a>
  </div>

  <h1 class="title">Annie &amp; Sam's <span class="hl">Treasure Hunt</span> 2026</h1>

  <!-- Step 1: pick a crew -->
  <section class="card" id="step-pick">
    <label class="field" for="team">Which crew are you in?
      <select id="team" disabled>
        <option value="">Loading crews…</option>
      </select>
    </label>
    <button class="btn" id="next" disabled>Next</button>
    <p class="notice bad" id="msg" role="status" aria-live="polite"></p>
  </section>

  <!-- Step 2: confirm + banana hat -->
  <section class="card hidden" id="step-confirm" aria-live="polite">
    <p class="dim" style="font-weight: 500;">You're joining</p>
    <h2 id="confirm-team" style="font-size: 32px;"></h2>
    <label class="check" for="hat">
      <input type="checkbox" id="hat">
      <span id="hat-label">Our captain is wearing the banana hat.</span>
    </label>
    <div class="btn-row">
      <button class="btn pink" id="start" disabled>Start hunting</button>
      <button class="btn secondary" id="back" type="button">Wrong crew, go back</button>
    </div>
    <p class="dim" id="switch-note" style="font-size: 14px;"></p>
    <p class="notice bad" id="msg2" role="status" aria-live="polite"></p>
  </section>
</main>
</div>

<script src="assets/config.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
<script>
(async function () {
  const $ = function (id) { return document.getElementById(id); };
  const select = $('team');
  let captains = {};

  function show(node, text) { node.textContent = text || ''; }

  // Already on a crew: skip straight to the clue (or finish a pending scan).
  if (Hunt.getTeam()) {
    const code = Hunt.takePendingCode();
    location.replace(code ? 'checkin.html?c=' + encodeURIComponent(code) : 'hunt.html');
    return;
  }

  try {
    const data = await Hunt.get('teams');
    captains = data.captains || {};
    select.innerHTML = '';
    select.appendChild(Hunt.el('option', { value: '', text: 'Choose your crew' }));
    data.teams.forEach(function (t) { select.appendChild(Hunt.el('option', { value: t, text: t })); });
    select.disabled = false;
  } catch (e) {
    select.innerHTML = '<option value="">Crews unavailable</option>';
    show($('msg'), e.message);
  }

  select.addEventListener('change', function () { $('next').disabled = !select.value; });

  $('next').addEventListener('click', function () {
    const team = select.value;
    if (!team) return;
    $('confirm-team').textContent = team;
    const cap = captains[team];
    $('hat-label').textContent = cap ? cap + ' is wearing the banana hat.' : 'Our captain is wearing the banana hat.';
    $('hat').checked = false;
    $('start').disabled = true;
    const left = Hunt.switchesLeft();
    $('switch-note').textContent = left > 0
      ? 'Choose carefully. You can switch crews once.'
      : "You've used your one switch. This one's final.";
    $('step-pick').classList.add('hidden');
    $('step-confirm').classList.remove('hidden');
    $('hat').focus();
  });

  $('hat').addEventListener('change', function () { $('start').disabled = !$('hat').checked; });

  $('back').addEventListener('click', function () {
    $('step-confirm').classList.add('hidden');
    $('step-pick').classList.remove('hidden');
    show($('msg2'), '');
    select.focus();
  });

  $('start').addEventListener('click', async function () {
    const team = select.value;
    const btn = $('start');
    btn.disabled = true;
    btn.textContent = 'Starting…';
    show($('msg2'), '');
    try {
      await Hunt.post('join', { team: team });
      Hunt.setTeam(team);
      const code = Hunt.takePendingCode();
      location.replace(code ? 'checkin.html?c=' + encodeURIComponent(code) : 'hunt.html');
    } catch (e) {
      show($('msg2'), e.message);
      btn.disabled = !$('hat').checked;
      btn.textContent = 'Start hunting';
    }
  });
})();
</script>
</body>
</html>
