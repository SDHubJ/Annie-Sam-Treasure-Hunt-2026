<title>Treasure Hunt Gallery</title>
<style>
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
  .chip { flex: 0 0 auto; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: #fff;
    border: var(--line); border-radius: 999px; padding: 8px 14px; min-height: 40px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (min-width: 700px) { .wrap.wide { max-width: 980px; } .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile { background: #fff; border: var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .tile button.media { position: relative; display: block; width: 100%; padding: 0; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; cursor: pointer;
    aspect-ratio: 1 / 1; background: repeating-linear-gradient(45deg, #fff4f9 0 10px, #ffe3ef 10px 20px); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play { position: absolute; inset: 0; margin: auto; width: 52px; height: 52px; border-radius: 50%; background: var(--pink); border: var(--line);
    display: flex; align-items: center; justify-content: center; }
  .tile .meta { display: flex; flex-direction: column; gap: 0; padding: 0 2px 2px; }
  .tile .meta strong { font-family: var(--display); font-weight: 400; font-size: 16px; line-height: 1.15; }
  .tile .meta span { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .tag { align-self: flex-start; font-family: var(--mono); font-size: 11px; background: var(--banana); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px; }
  dialog { border: var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px; width: min(92vw, 720px); background: #fff; color: var(--ink); }
  dialog::backdrop { background: rgba(34, 16, 31, 0.7); }
  dialog .frame { width: 100%; aspect-ratio: 9 / 16; max-height: 72vh; border: 2px solid var(--ink); border-radius: 10px; display: block; background: #000; }
  dialog img.frame { aspect-ratio: auto; object-fit: contain; background: #fff4f9; }
  dialog .bar-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  dialog .bar-top strong { font-family: var(--display); font-weight: 400; font-size: 20px; }
  .close { font: inherit; font-weight: 700; background: #fff; border: var(--line); border-radius: 999px; padding: 6px 14px; min-height: 40px; cursor: pointer; }
</style>
</head>
